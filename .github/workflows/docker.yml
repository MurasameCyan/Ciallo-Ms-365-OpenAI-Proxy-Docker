name: Build and Push Docker Image

on:
  push:
    branches: [multi, fox]
    paths:
      - "src/**"
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/docker.yml"
      # A dependency change alone must rebuild: the image installs from the lock,
      # so a lock that moves without a rebuild ships stale packages.
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Two images from one Dockerfile. The default stays lean for M365-only
    # deployments; the -camoufox variant carries the ~936 MB Firefox that lets
    # consumer accounts renew their own credentials. Tags are suffixed so the
    # default keeps the bare branch/sha names it always had.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            camoufox: "false"
            suffix: ""
          - variant: camoufox
            camoufox: "true"
            suffix: "-camoufox"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=sha,prefix=${{ github.ref_name }}-,suffix=${{ matrix.suffix }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the commit so admin sidebar can show GitHub hash (image has no .git).
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            WITH_CAMOUFOX=${{ matrix.camoufox }}
          # Scoped per variant: one cache shared across both would thrash, since
          # the dependency layer differs between them.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
